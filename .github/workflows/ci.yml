name: CI

# The final quality gate (ARCHITECTURE.md §5). A red run blocks merging.
on:
  push:
    branches: [main, staging, production]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Format
        run: uv run ruff format --check . ../evals
      - name: Lint
        run: uv run ruff check . ../evals
      - name: Types
        run: uv run pyright && uv run pyright ../evals
      - name: Architecture contracts
        run: uv run lint-imports
      - name: Tests and coverage
        run: uv run pytest -n auto --cov=app -q
      - name: Dependency audit
        # Resolve markers for this runner's interpreter (pip-audit uses its own).
        run: |
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt \
            | uv run python scripts/locked_requirements.py > "$RUNNER_TEMP/audit.txt"
          uvx pip-audit -r "$RUNNER_TEMP/audit.txt" --disable-pip --no-deps

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format, lint, types, tests, build
        run: pnpm -s check
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
