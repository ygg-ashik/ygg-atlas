# Access logs never carry an OAuth consent transaction id (txn): neither the SPA route's
# query string (/oauth/consent?txn=...) nor the consent API path (/api/v1/oauth/consent/<txn>),
# nor a Referer that points at either. These maps sit at http level (conf.d is included there).
map $request_uri $atlas_log_uri {
    ~^/oauth/consent(/|[?#]|$)   /oauth/consent;
    ~^/api/v1/oauth/consent/     /api/v1/oauth/consent/-;
    default                      $request_uri;
}

map $http_referer $atlas_log_referer {
    ""                           -;
    ~/oauth/consent              -;
    default                      $http_referer;
}

log_format atlas '$remote_addr - $remote_user [$time_local] '
                 '"$request_method $atlas_log_uri $server_protocol" $status $body_bytes_sent '
                 '"$atlas_log_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log atlas;

    # API proxy to the backend service (docker-compose network).
    # Buffering is disabled so SSE chat streams flush token-by-token.
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The consent API (GET .../consent/<txn>, POST .../consent). No trailing slash: a prefix
    # ending in "/" would 301 the POST. The access log already redacts the txn;
    # raising error_log to crit keeps upstream errors (which echo the request line) quiet too.
    location ^~ /api/v1/oauth/consent {
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }

    # MCP (streamable HTTP + OAuth endpoints) and OAuth discovery documents.
    # $http_host keeps the port: the MCP transport's DNS-rebinding check allows
    # ATLAS_PUBLIC_URL's host:port, and a bare $host would be refused with 421 (plan C1, D26).
    location /mcp-server/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Only the OAuth discovery documents (RFC 8414, RFC 9728) go to the backend; every
    # backend discovery path starts with /.well-known/oauth-. Other /.well-known/ paths
    # (an outer proxy's ACME challenge, for example) are not ours to answer.
    location ^~ /.well-known/oauth- {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }

    # OAuth consent page (SPA route). Never framed (clickjacking), never leaks its ?txn=
    # through a Referer, and never cached. A trailing slash gets the same headers.
    location ~ ^/oauth/consent/?$ {
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    # SPA fallback. The app shell is never framed.
    location / {
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|map|jpe?g|png|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
