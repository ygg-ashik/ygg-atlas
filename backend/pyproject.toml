[project]
name = "ygg-atlas-backend"
version = "0.1.0"
description = "ygg-atlas backend: chat API, agent loop, atlas semantic registry, connectors, MCP server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlmodel>=0.0.24",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "anthropic>=0.45",
    "openai>=1.60",
    "firebase-admin>=6.6",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "httpx>=0.28",
    # v1 API (FastMCP); 2.x renamed it to MCPServer — migrate deliberately later
    "mcp>=1.2,<2",
    "python-dateutil>=2.9",
    # transitive pin: cryptography 50.x ships no wheel for this platform and
    # fails to build from source with the system cargo
    "cryptography<46",
]

[project.optional-dependencies]
ga4 = ["google-analytics-data>=0.18"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "aiosqlite>=0.20",
    "ruff>=0.9",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # aiosqlite datetime adapter — test database only; production uses asyncpg
    "ignore:The default datetime adapter is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: `Depends(...)` in argument defaults is the standard FastAPI idiom
ignore = ["B008"]

[tool.coverage.run]
source = ["app"]
omit = ["app/mcp/*", "migrations/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
