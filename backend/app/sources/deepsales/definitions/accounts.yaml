id: ds_account
name: Portfolio accounts
description: >
  Corporate accounts under management (DeepSales account_profiles). "Analyzed"
  accounts (analyzed_at set) carry health scores and revenue KPIs; portfolio
  KPIs are computed over analyzed accounts only. Health bands: Green / Yellow /
  Red (NULL = not yet scored).
pii_fields: [csm_name]
fields:
  account_code: Account identifier (matches corporate.corporate_code)
  account_name: Client company name
  product: "Product code: 'AW' (AtWork) or 'REW' (YouRewards)"
  health_v2_score: Health score 0-100
  health_v2_status: "Band: Green | Yellow | Red | NULL (unscored)"
  revenue_ytd: Year-to-date revenue
  avg_order_value: Typical transaction size
  active_rate: Engagement rate 0-1
  analyzed_at: Last analysis time (NULL = never analyzed)
scope_dimensions:
  csm:
    column: csm_name
    self: csm_name
    description: Customer success manager owning the account ($self = the user's csm_name)
freshness_query: >
  SELECT MAX(last_synced_at) AS freshest FROM account_profiles WHERE TRUE {{scope}}
metrics:
  - id: ds_total_accounts
    name: Analyzed portfolio accounts
    description: >
      Number of corporate accounts that have been analyzed (health-scored).
      Breakdown available by health band.
    unit: accounts
    time_scope: snapshot
    query: >
      SELECT COUNT(*) AS value FROM account_profiles
      WHERE analyzed_at IS NOT NULL {{scope}}
    breakdown_label_class: category
    breakdown_query: >
      SELECT COALESCE(health_v2_status, 'Unscored') AS label, COUNT(*) AS value
      FROM account_profiles WHERE analyzed_at IS NOT NULL {{scope}}
      GROUP BY 1 ORDER BY value DESC LIMIT :limit
  - id: ds_at_risk_accounts
    name: At-risk accounts
    description: >
      Analyzed accounts in the Red health band (health_v2_status = 'Red').
      Lower is better.
    unit: accounts
    time_scope: snapshot
    good_direction: down
    query: >
      SELECT COUNT(*) AS value FROM account_profiles
      WHERE analyzed_at IS NOT NULL AND health_v2_status = 'Red' {{scope}}
    breakdown_label_class: business_name
    breakdown_query: >
      SELECT account_name AS label, COALESCE(health_v2_score, 0) AS value
      FROM account_profiles
      WHERE analyzed_at IS NOT NULL AND health_v2_status = 'Red' {{scope}}
      ORDER BY revenue_ytd DESC NULLS LAST LIMIT :limit
  - id: ds_portfolio_revenue_ytd
    name: Portfolio revenue YTD
    description: >
      Sum of year-to-date revenue across analyzed accounts. Breakdown gives the
      top accounts by YTD revenue.
    unit: AED
    time_scope: snapshot
    query: >
      SELECT COALESCE(SUM(revenue_ytd), 0) AS value FROM account_profiles
      WHERE analyzed_at IS NOT NULL {{scope}}
    breakdown_label_class: business_name
    breakdown_query: >
      SELECT account_name AS label, revenue_ytd AS value FROM account_profiles
      WHERE analyzed_at IS NOT NULL AND revenue_ytd IS NOT NULL {{scope}}
      ORDER BY revenue_ytd DESC LIMIT :limit
  - id: ds_avg_order_value
    name: Portfolio average order value
    description: Mean of per-account average order values across analyzed accounts.
    unit: AED
    time_scope: snapshot
    query: >
      SELECT COALESCE(AVG(avg_order_value), 0) AS value FROM account_profiles
      WHERE analyzed_at IS NOT NULL AND avg_order_value IS NOT NULL {{scope}}
  - id: ds_avg_active_rate
    name: Portfolio average active rate
    description: Mean engagement rate (0-1) across analyzed accounts.
    unit: rate
    time_scope: snapshot
    query: >
      SELECT COALESCE(AVG(active_rate), 0) AS value FROM account_profiles
      WHERE analyzed_at IS NOT NULL AND active_rate IS NOT NULL {{scope}}
