id: customer
name: Customers
description: >
  Registered customers (consumer and corporate buyers). Demo dataset until the
  production read replica is connected.
pii_fields: [email, name]
fields:
  id: Customer id
  segment: "'consumer' | 'corporate'"
  created_at: Signup time (UTC)
scope_dimensions:
  segment:
    column: segment
    description: Customer segment ('consumer' or 'corporate')
freshness_query: >
  SELECT MAX(created_at) AS freshest FROM demo_customers WHERE TRUE {{scope}}
metrics:
  - id: customers_total
    name: Total customers
    description: All registered customers as of now (point-in-time snapshot).
    unit: customers
    time_scope: snapshot
    query: SELECT COUNT(*) AS value FROM demo_customers WHERE TRUE {{scope}}
  - id: new_customers
    name: New customers
    description: Customers who signed up in the period.
    unit: customers
    query: >
      SELECT COUNT(*) AS value FROM demo_customers
      WHERE created_at >= :start AND created_at <= :end
      {{scope}}
  - id: new_corporate_customers
    name: New corporate customers
    description: Corporate (B2B) accounts created in the period.
    unit: customers
    query: >
      SELECT COUNT(*) AS value FROM demo_customers
      WHERE segment = 'corporate' AND created_at >= :start AND created_at <= :end
      {{scope}}
